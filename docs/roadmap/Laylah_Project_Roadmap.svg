<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2460" viewBox="0 0 1920 2460" role="img" aria-labelledby="title desc">
  <title id="title">Laylah application roadmap</title>
  <desc id="desc">Current application status and an eight-stage proposed roadmap, from database migration through secure deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f7f0"/><stop offset="1" stop-color="#edf2e8"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173e31"/><stop offset="1" stop-color="#2d6047"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173e31" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto"><path d="M1 1 L9 6 L1 11" fill="none" stroke="#7b9887" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#20352b}
      .muted{fill:#52665a}.small{font-size:20px}.body{font-size:21px}.stage{font-size:29px;font-weight:700}.num{font-size:27px;font-weight:800;fill:#fff}.tag{font-size:17px;font-weight:800;letter-spacing:1.5px}
    </style>
  </defs>
  <rect width="1920" height="2460" fill="url(#bg)"/>
  <rect x="0" y="0" width="1920" height="18" fill="#244d3b"/>
  <text x="92" y="104" font-size="26" font-weight="800" letter-spacing="5" fill="#52725e">LAYLAH • PRODUCT + APPSEC</text>
  <text x="92" y="176" font-size="58" font-weight="800" fill="#173e31">Application roadmap</text>
  <text x="95" y="222" font-size="24" class="muted">A clear path from today’s menu prototype to a secure, maintainable restaurant platform</text>

  <rect x="92" y="264" width="1736" height="276" rx="28" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="132" y="314" class="tag" fill="#d7edb2">WHERE WE ARE NOW</text>
  <line x1="704" y1="340" x2="704" y2="510" stroke="#ffffff" stroke-opacity=".2"/>
  <line x1="1278" y1="340" x2="1278" y2="510" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="132" y="365" font-size="28" font-weight="750" fill="#ffffff">Application foundation</text>
  <text x="132" y="405" class="body" fill="#edf5e9">React/Vite restaurant UI • category filters</text>
  <text x="132" y="439" class="body" fill="#edf5e9">Express read-only menu API • PostgreSQL</text>
  <text x="132" y="473" class="body" fill="#edf5e9">5 sample dishes • 5 API tests</text>
  <text x="132" y="507" class="small" fill="#d7edb2">Cloud setup reports tests, lint, build &amp; menu checks passed</text>

  <text x="746" y="365" font-size="28" font-weight="750" fill="#ffffff">Shared development</text>
  <text x="746" y="405" class="body" fill="#edf5e9">GitHub: shoaib1121/Laylah • main</text>
  <text x="746" y="439" class="body" fill="#edf5e9">Published Codex Cloud environment</text>
  <text x="746" y="473" class="body" fill="#edf5e9">Same checkout verified on desktop + mobile</text>
  <text x="746" y="507" class="small" fill="#d7edb2">Cloud checkout verified at: 4eeee4e</text>

  <text x="1320" y="365" font-size="28" font-weight="750" fill="#ffffff">Still to build</text>
  <text x="1320" y="405" class="body" fill="#edf5e9">No tracked database migration yet</text>
  <text x="1320" y="439" class="body" fill="#edf5e9">No login, roles, orders or admin tools</text>
  <text x="1320" y="473" class="body" fill="#edf5e9">No CI pipeline or production deployment</text>
  <text x="1320" y="507" class="small" fill="#d7edb2">Product scope and hosting are open decisions</text>

  <text x="92" y="603" font-size="31" font-weight="800" fill="#173e31">PROPOSED DEVELOPMENT FLOW</text>
  <text x="1828" y="602" text-anchor="end" class="small muted">Follow in order • validate each stage before moving on</text>

  <!-- vertical flow rail -->
  <g fill="none" stroke="#9ab19f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M151 760 V856"/><path d="M151 952 V1048"/><path d="M151 1144 V1240"/>
    <path d="M151 1336 V1432"/><path d="M151 1528 V1624"/><path d="M151 1720 V1816"/><path d="M151 1912 V2008"/>
  </g>

  <!-- Stage 1 -->
  <rect x="210" y="632" width="1618" height="166" rx="24" fill="#e3f0db" stroke="#76a26f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="715" r="43" fill="#43834d"/><text x="151" y="725" text-anchor="middle" class="num">1</text>
  <rect x="246" y="653" width="146" height="31" rx="15" fill="#43834d"/><text x="319" y="675" text-anchor="middle" class="tag" fill="#fff">BUILT</text>
  <text x="420" y="681" class="stage">Working menu foundation</text>
  <text x="246" y="727" class="body">Restaurant UI → public menu API → PostgreSQL; category filtering and health endpoint are implemented.</text>
  <text x="246" y="765" class="body muted">Keep the menu public and read-only until a protected feature is agreed.</text>

  <!-- Stage 2 -->
  <rect x="210" y="824" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="907" r="43" fill="#38755a"/><text x="151" y="917" text-anchor="middle" class="num">2</text>
  <rect x="246" y="845" width="202" height="31" rx="15" fill="#d7edb2"/><text x="347" y="867" text-anchor="middle" class="tag" fill="#28563e">NEXT FOUNDATION</text>
  <text x="474" y="873" class="stage">Make the database reproducible</text>
  <text x="246" y="919" class="body">Write a tracked SQL migration for schema, table, constraints, least-privilege grants and the five seed dishes.</text>
  <text x="246" y="957" class="body muted">Then add PostgreSQL integration tests; keep the existing fast test-double API tests.</text>

  <!-- Stage 3 -->
  <rect x="210" y="1016" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="1099" r="43" fill="#38755a"/><text x="151" y="1109" text-anchor="middle" class="num">3</text>
  <rect x="246" y="1037" width="120" height="31" rx="15" fill="#e3eee7"/><text x="306" y="1059" text-anchor="middle" class="tag" fill="#28563e">API</text>
  <text x="392" y="1065" class="stage">Close API contract and security gaps</text>
  <text x="246" y="1111" class="body">Agree unknown-query behavior; document request/response shapes; add database error and hostile-input regression coverage.</text>
  <text x="246" y="1149" class="body muted">Consider OpenAPI, rate limits and operational logging as the API grows.</text>

  <!-- Stage 4 decision -->
  <rect x="210" y="1208" width="1618" height="166" rx="24" fill="#fff3d8" stroke="#d6a441" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="1291" r="43" fill="#bd8421"/><text x="151" y="1301" text-anchor="middle" class="num">4</text>
  <rect x="246" y="1229" width="180" height="31" rx="15" fill="#e8b954"/><text x="336" y="1251" text-anchor="middle" class="tag" fill="#563b0d">OWNER DECISION</text>
  <text x="452" y="1257" class="stage">Choose the restaurant product scope</text>
  <text x="246" y="1303" class="body">Decide whether Laylah stays informational or adds menu administration, reservations, pickup/delivery or ordering.</text>
  <text x="246" y="1341" class="body muted">Payment, fulfillment rules and who can do what remain undecided; don’t build these by assumption.</text>

  <!-- Stage 5 -->
  <rect x="210" y="1400" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="1483" r="43" fill="#38755a"/><text x="151" y="1493" text-anchor="middle" class="num">5</text>
  <rect x="246" y="1421" width="158" height="31" rx="15" fill="#e3eee7"/><text x="325" y="1443" text-anchor="middle" class="tag" fill="#28563e">WHEN NEEDED</text>
  <text x="430" y="1449" class="stage">Add accounts and server-enforced access</text>
  <text x="246" y="1495" class="body">Use the agreed cookie-based direction: sessions, secure cookie settings, account lifecycle and CSRF defenses.</text>
  <text x="246" y="1533" class="body muted">Introduce customer/admin roles and ownership checks only for chosen protected features.</text>

  <!-- Stage 6 -->
  <rect x="210" y="1592" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="1675" r="43" fill="#38755a"/><text x="151" y="1685" text-anchor="middle" class="num">6</text>
  <rect x="246" y="1613" width="178" height="31" rx="15" fill="#e3eee7"/><text x="335" y="1635" text-anchor="middle" class="tag" fill="#28563e">PRODUCT SLICES</text>
  <text x="450" y="1641" class="stage">Build the selected customer and admin journeys</text>
  <text x="246" y="1687" class="body">Possible admin: manage menu and later orders. Possible customer: account, reservation or order status—based on Stage 4.</text>
  <text x="246" y="1725" class="body muted">Ship one end-to-end feature at a time with authorization, auditability and tests included.</text>

  <!-- Stage 7 -->
  <rect x="210" y="1784" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="1867" r="43" fill="#38755a"/><text x="151" y="1877" text-anchor="middle" class="num">7</text>
  <rect x="246" y="1805" width="164" height="31" rx="15" fill="#e3eee7"/><text x="328" y="1827" text-anchor="middle" class="tag" fill="#28563e">APPSEC + CI</text>
  <text x="436" y="1833" class="stage">Automate checks and practice security testing</text>
  <text x="246" y="1879" class="body">Add CI for builds and tests, then dependency, secret and static-analysis checks; test safely in a non-production environment.</text>
  <text x="246" y="1917" class="body muted">Use Burp/ZAP for DAST when available; fix findings and add regression tests.</text>

  <!-- Stage 8 -->
  <rect x="210" y="1976" width="1618" height="166" rx="24" fill="#ffffff" stroke="#b8c9bb" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="151" cy="2059" r="43" fill="#38755a"/><text x="151" y="2069" text-anchor="middle" class="num">8</text>
  <rect x="246" y="1997" width="140" height="31" rx="15" fill="#e3eee7"/><text x="316" y="2019" text-anchor="middle" class="tag" fill="#28563e">RELEASE</text>
  <text x="412" y="2025" class="stage">Deploy, monitor and recover</text>
  <text x="246" y="2071" class="body">Choose hosting after scope and cost review; prepare HTTPS, production secrets, database backups and restore procedures.</text>
  <text x="246" y="2109" class="body muted">Add monitoring, incident response and a tested rollback path. Hosting provider is still open.</text>

  <!-- cross-cutting loop -->
  <rect x="92" y="2180" width="1736" height="184" rx="28" fill="#173e31"/>
  <text x="132" y="2227" class="tag" fill="#d7edb2">APPLIED THROUGH EVERY STAGE</text>
  <text x="132" y="2280" font-size="26" font-weight="750" fill="#ffffff">Requirements</text>
  <text x="339" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="383" y="2280" font-size="26" font-weight="750" fill="#ffffff">Threat model</text>
  <text x="586" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="630" y="2280" font-size="26" font-weight="750" fill="#ffffff">Secure design</text>
  <text x="841" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="884" y="2280" font-size="26" font-weight="750" fill="#ffffff">Build</text>
  <text x="991" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="1035" y="2280" font-size="26" font-weight="750" fill="#ffffff">Review + test</text>
  <text x="1240" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="1284" y="2280" font-size="26" font-weight="750" fill="#ffffff">Remediate</text>
  <text x="1454" y="2280" font-size="26" fill="#d7edb2">→</text>
  <text x="1496" y="2280" font-size="26" font-weight="750" fill="#ffffff">Regression check</text>
  <text x="132" y="2326" class="small" fill="#edf5e9">Solid green = built or verified   •   White = planned sequence   •   Amber = product decision required</text>
  <text x="92" y="2410" class="small muted">Roadmap is proposed and incremental. Ordering, payments, reservations, roles, hosting and timelines require owner decisions.</text>
</svg>

